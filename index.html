<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Planter · 植物照護日記</title><style>
:root{--bg:#fafaf8;--paper:#fff;--ink:#262b28;--muted:#788079;--green:#718675;--line:#e8ebe6;--soft:#eff3ee;--red:#b15e50}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.app{max-width:850px;margin:auto;padding:22px 18px 108px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-family:Georgia,serif;font-size:32px;letter-spacing:-1.2px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h1{font-size:29px;letter-spacing:-.8px;margin:0 0 8px}h2{font-size:20px;margin:26px 0 14px}p{line-height:1.65}.muted{color:var(--muted)}.small{font-size:13px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden}.pad{padding:18px}.stack{display:grid;gap:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.plant-photo{height:172px;background:#edf1eb;position:relative;overflow:hidden}.plant-photo img{width:100%;height:100%;object-fit:cover}.placeholder{display:grid;place-items:center;height:100%;font-size:64px;color:#819784}.plant-title{font-size:17px;font-weight:650;margin:0 0 6px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:6px 10px;background:var(--soft);font-size:12px;color:#526955}.pill.due{background:#e8efe7}.pill.overdue{background:#f9ece9;color:#a05042}.watering-overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.34);pointer-events:none}.watering-overlay span{font-size:90px;filter:drop-shadow(0 3px 8px #fff)}.btn{border:0;border-radius:12px;background:var(--green);color:white;padding:12px 17px;font-weight:650}.btn.secondary{background:var(--soft);color:#455e49}.btn.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#a65b50}.btn.smallbtn{font-size:12px;padding:8px 11px}.actions{display:flex;flex-wrap:wrap;gap:8px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:9px 10px max(12px,env(safe-area-inset-bottom));z-index:20}.nav-inner{display:grid;grid-template-columns:repeat(4,1fr);width:min(850px,100%)}.nav button{border:0;background:none;color:#879087;padding:8px 0;display:grid;gap:4px;justify-items:center;font-size:12px}.nav button.active{color:#4c6e54;font-weight:750}.nav .ico{font-size:23px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px;font-size:13px;font-weight:650}.field input,.field select,.field textarea{width:100%;background:white;border:1px solid #d9dfd8;border-radius:10px;padding:12px;min-width:0;color:var(--ink)}.field textarea{min-height:75px}.full{grid-column:1/-1}.view{display:none}.view.active{display:block}.empty{padding:42px 22px;text-align:center;border:1px dashed #cbd6cc;border-radius:18px;background:#fff}.empty .big{font-size:48px}.detail-photo{width:100%;height:280px;object-fit:cover;background:#edf1eb;border-radius:20px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{border:1px solid transparent;border-radius:10px;min-height:65px;background:#fff;padding:6px 2px;display:flex;align-items:center;flex-direction:column;gap:5px}.day.active{border-color:var(--green)}.day.today{background:var(--soft)}.day.other{opacity:.35}.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}.dot{width:6px;height:6px;border-radius:50%;background:#789b81}.dot.fertilize{background:#c8a66b}.question{padding:15px 0;border-bottom:1px solid var(--line)}.question:last-child{border-bottom:0}.question select{margin-top:8px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:white}.score{font-size:56px;font-family:Georgia,serif;color:#59745f}.chart{width:100%;height:auto}.notice{background:#f3f5f0;border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.6}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#273b2c;color:white;padding:12px 18px;border-radius:12px;z-index:50;max-width:90%;box-shadow:0 6px 30px #0002}.record{padding:12px 0;border-bottom:1px solid var(--line)}.record:last-child{border-bottom:0}.link{border:0;background:none;text-decoration:underline;color:#506c56;padding:3px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px;border-radius:15px;background:white;border:1px solid var(--line)}.stat strong{display:block;font-size:25px;margin-bottom:4px}.back{background:none;border:0;padding:8px 0;color:#55705b}.filehint{font-size:12px;color:var(--muted)}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.plant-photo{height:185px}}@media(max-width:450px){.form-grid{grid-template-columns:1fr}.grid{gap:10px}.plant-photo{height:145px}.plant-title{font-size:15px}.pad{padding:13px}.app{padding:19px 14px 100px}.day{min-height:57px}}
</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">Personal plant care journal</div><div class="logo">Planter<span style="color:#8fa591">.</span></div></div><button class="btn secondary smallbtn" id="topAdd">＋ 新增植物</button></header><section id="home" class="view active"></section><section id="plants" class="view"></section><section id="calendar" class="view"></section><section id="settings" class="view"></section><section id="detail" class="view"></section><section id="editor" class="view"></section><section id="assessment" class="view"></section></main><nav class="nav"><div class="nav-inner"><button data-page="home" class="active"><span class="ico">⌂</span>首頁</button><button data-page="calendar"><span class="ico">▦</span>月曆</button><button data-page="plants"><span class="ico">♧</span>植物</button><button data-page="settings"><span class="ico">⚙</span>設定</button></div></nav><script>
'use strict';
const DB='planter-v1',VERSION=1;let db,plants=[],care=[],health=[],page='home',selectedId=null,editId=null,month=new Date().getMonth(),year=new Date().getFullYear(),pickedDate=today(),pendingPhoto=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();return localDate(d)}function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parseDate(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}function addDays(s,n){let d=parseDate(s);d.setDate(d.getDate()+n);return localDate(d)}function diff(a,b){return Math.round((parseDate(a)-parseDate(b))/86400000)}function fmt(s){return s?s.replaceAll('-','/'):'—'}function toast(s){$('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),2800)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,VERSION);r.onupgradeneeded=()=>{let d=r.result;for(let t of ['plants','care','health'])if(!d.objectStoreNames.contains(t))d.createObjectStore(t,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function all(t){return new Promise((res,rej)=>{let r=db.transaction(t).objectStore(t).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(t,v){return new Promise((res,rej)=>{let r=db.transaction(t,'readwrite').objectStore(t).put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function del(t,id){return new Promise((res,rej)=>{let r=db.transaction(t,'readwrite').objectStore(t).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}async function reload(){[plants,care,health]=await Promise.all(['plants','care','health'].map(all));render()}
function nextDate(p){return p.nextWatering||addDays(p.lastWatered,p.wateringInterval)}function status(p){let d=diff(nextDate(p),today());return {d,label:d>0?`D-${d}`:d<0?`D+${-d}`:'澆水日',cls:d<0?'overdue':d===0?'due':''}}function sorted(){return [...plants].sort((a,b)=>nextDate(a).localeCompare(nextDate(b))||a.name.localeCompare(b.name,'zh-Hant'))}function latestScore(id){return health.filter(h=>h.plantId===id).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt))[0]}
function photo(p){return p.photo?`<img src="${esc(p.photo)}" alt="${esc(p.name)}的照片">`:'<div class="placeholder">♧</div>'}function card(p){let s=status(p),h=latestScore(p.id);return `<article class="card"><div class="plant-photo" data-detail="${esc(p.id)}" role="button" tabindex="0">${photo(p)}${s.d===0?'<div class="watering-overlay"><span aria-label="今日澆水日">🚿</span></div>':''}</div><div class="pad stack" style="gap:9px"><div><div class="plant-title">${esc(p.name)}</div><div class="small muted">${esc(p.species)}</div></div><div class="row"><span class="pill ${s.cls}">${s.d===0?'🚿':esc(s.label)}</span><span class="small muted">${fmt(nextDate(p))}</span></div><div class="small muted">健康分數：${h?h.score+' / 100':'尚未評估'}</div><div class="actions"><button class="btn secondary smallbtn" data-water="${esc(p.id)}">記錄澆水</button><button class="btn ghost smallbtn" data-detail="${esc(p.id)}">詳情</button></div></div></article>`}
function show(p){page=p;$$('.view').forEach(x=>x.classList.toggle('active',x.id===p));$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));window.scrollTo(0,0);render()}function render(){let due=sorted().filter(p=>status(p).d<=0),future=sorted().filter(p=>status(p).d>0);$('#home').innerHTML=`<div class="eyebrow">TODAY · ${fmt(today())}</div><h1>今天，照顧好你的植物。</h1><p class="muted">每一點日常照顧，都是成長的開始。</p><div class="stats"><div class="stat"><strong>${plants.length}</strong><span class="small muted">植物總數</span></div><div class="stat"><strong>${due.length}</strong><span class="small muted">待澆水</span></div><div class="stat"><strong>${health.length}</strong><span class="small muted">評估紀錄</span></div></div><h2>待辦照護</h2>${due.length?`<div class="grid">${due.map(card).join('')}</div>`:`<div class="empty"><div class="big">♧</div><p>${plants.length?'目前沒有到期的澆水事項':'開始新增你的第一株植物'}</p>${plants.length?'':'<button class="btn" data-add>新增植物</button>'}</div>`}${future.length?`<h2>接下來的澆水計畫</h2><div class="grid">${future.slice(0,6).map(card).join('')}</div>`:''}`;
$('#plants').innerHTML=`<div class="row"><div><div class="eyebrow">MY COLLECTION</div><h1>我的植物</h1></div><button class="btn" data-add>＋ 新增</button></div><p class="muted small">依下次澆水日期由近到遠排序</p>${plants.length?`<div class="grid">${sorted().map(card).join('')}</div>`:'<div class="empty">尚無植物資料，點擊新增開始建立。</div>'}`;renderCalendar();renderSettings();if(selectedId&&plants.some(p=>p.id===selectedId))renderDetail()}
function renderCalendar(){let first=new Date(year,month,1),start=first.getDay(),days=new Date(year,month+1,0).getDate();let cells='';for(let i=0;i<start;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let dt=localDate(new Date(year,month,d)),events=care.filter(c=>c.date===dt);cells+=`<button class="day ${dt===today()?'today':''} ${dt===pickedDate?'active':''}" data-day="${dt}"><span>${d}</span><span class="dots">${events.slice(0,5).map(e=>`<span class="dot ${e.type==='fertilize'?'fertilize':''}"></span>`).join('')}</span></button>`}let entries=care.filter(c=>c.date===pickedDate).sort((a,b)=>a.type.localeCompare(b.type));$('#calendar').innerHTML=`<div class="eyebrow">CARE CALENDAR</div><h1>照護月曆</h1><div class="card pad"><div class="row"><button class="btn ghost smallbtn" data-month="-1">←</button><strong>${year} 年 ${month+1} 月</strong><button class="btn ghost smallbtn" data-month="1">→</button></div><div class="calendar" style="margin-top:20px">${['日','一','二','三','四','五','六'].map(x=>`<div class="small muted" style="text-align:center">${x}</div>`).join('')}${cells}</div><p class="small muted">● 綠色：澆水　● 金色：施肥</p></div><h2>${fmt(pickedDate)} 的照護紀錄</h2>${entries.length?`<div class="card pad">${entries.map(c=>recordRow(c)).join('')}</div>`:'<p class="muted">這天沒有照護紀錄。</p>'}`}
function recordRow(c){let p=plants.find(x=>x.id===c.plantId);return `<div class="record row"><div><strong>${esc(p?.name||'已刪除植物')}</strong><div class="small muted">${c.type==='water'?'澆水':'施肥'} · ${fmt(c.date)} ${c.note?' · '+esc(c.note):''}</div></div><button class="link" data-delete-care="${esc(c.id)}">刪除</button></div>`}
function renderSettings(){$('#settings').innerHTML=`<div class="eyebrow">PREFERENCES</div><h1>設定與備份</h1><div class="card pad stack"><h2 style="margin:0">資料備份</h2><p class="muted small">植物、照片、照護紀錄及健康評估均儲存於目前瀏覽器。清除瀏覽器網站資料可能造成紀錄遺失，建議定期匯出備份。</p><button class="btn" id="export">匯出 JSON 備份</button><label class="field">匯入 JSON 備份（完整取代現有資料）<input id="import" type="file" accept="application/json,.json"></label><div class="notice">本網站不需要登入，也不會將你的植物資料上傳至伺服器。不同裝置之間不會自動同步。</div></div><h2>關於 Planter</h2><p class="muted small">v1.0 · 健康評分為規則式問卷參考指標，不是 AI 照片診斷。提醒僅在開啟網站時顯示，不會在背景推播。</p>`}
function renderDetail(){let p=plants.find(x=>x.id===selectedId);if(!p)return;let s=status(p),h=latestScore(p.id),records=care.filter(c=>c.plantId===p.id).sort((a,b)=>b.date.localeCompare(a.date)),history=health.filter(x=>x.plantId===p.id).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt));$('#detail').innerHTML=`<button class="back" data-page="plants">← 返回植物列表</button><div class="detail-photo" style="overflow:hidden">${p.photo?`<img src="${esc(p.photo)}" alt="${esc(p.name)}" style="width:100%;height:100%;object-fit:cover">`:'<div class="placeholder">♧</div>'}</div><div class="row" style="margin-top:16px"><div><h1>${esc(p.name)}</h1><div class="muted">${esc(p.species)}</div></div><span class="pill ${s.cls}">${s.d===0?'🚿 澆水日':esc(s.label)}</span></div><p class="muted small">下次澆水：${fmt(nextDate(p))}　｜　週期：${p.wateringInterval} 天<br>擺放位置：${esc(p.location||'未設定')}　｜　日照：${esc(p.sunlight||'未設定')}</p><div class="actions"><button class="btn" data-water="${p.id}">立即澆水</button><button class="btn secondary" data-care="${p.id}">新增照護紀錄</button><button class="btn ghost" data-edit="${p.id}">編輯植物</button></div><h2>健康評估</h2><div class="card pad"><div class="row"><div><div class="score">${h?h.score:'—'}</div><div class="small muted">${h?'最近評估：'+fmt(h.date)+' · '+level(h.score):'尚未進行評估'}</div></div><button class="btn secondary" data-assess="${p.id}">開始評估</button></div><p class="small muted">依照葉片、土壤與日照等問卷計算參考分數，並非 AI 診斷。</p>${history.length?chart(history):''}</div><h2>照護紀錄</h2><div class="card pad">${records.length?records.map(recordRow).join(''):'<p class="muted">尚無照護紀錄。</p>'}</div><h2>歷次健康評估</h2><div class="card pad">${history.length?[...history].reverse().map(x=>`<div class="record row"><div><strong>${x.score} 分</strong><div class="small muted">${fmt(x.date)} · ${esc(level(x.score))}</div></div><button class="link" data-delete-health="${x.id}">刪除</button></div>`).join(''):'<p class="muted">尚無評估紀錄。</p>'}</div><p style="margin-top:25px"><button class="btn danger smallbtn" data-delete-plant="${p.id}">刪除此植物</button></p>`}
function chart(arr){let byDay=new Map;arr.forEach(h=>byDay.set(h.date,h));let data=[...byDay.values()].sort((a,b)=>a.date.localeCompare(b.date)),w=600,ht=230,pad=40;let x=i=>pad+(data.length===1?(w-2*pad)/2:i*(w-2*pad)/(data.length-1)),y=v=>ht-pad-v*(ht-2*pad)/100;let path=data.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(d.score).toFixed(1)).join(' ');return `<h3>健康分數趨勢</h3><svg class="chart" viewBox="0 0 ${w} ${ht}" role="img" aria-label="健康分數折線圖">${[0,25,50,75,100].map(n=>`<line x1="${pad}" x2="${w-pad}" y1="${y(n)}" y2="${y(n)}" stroke="#e5e9e3"/><text x="${pad-8}" y="${y(n)+4}" text-anchor="end" fill="#899188" font-size="12">${n}</text>`).join('')}<path d="${path}" fill="none" stroke="#718675" stroke-width="3"/>${data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.score)}" r="5" fill="#718675"><title>${esc(d.date)}：${d.score} 分</title></circle>`).join('')}<text x="${pad}" y="${ht-5}" font-size="12" fill="#899188">${fmt(data[0].date)}</text><text x="${w-pad}" y="${ht-5}" font-size="12" fill="#899188" text-anchor="end">${fmt(data.at(-1).date)}</text></svg>`}
function editor(id){editId=id||null;pendingPhoto=null;let p=plants.find(x=>x.id===id)||{};$('#editor').innerHTML=`<button class="back" data-page="${id?'detail':'plants'}">← 返回</button><h1>${id?'編輯植物':'新增植物'}</h1><form id="plantForm" class="card pad form-grid"><label class="field">植物名稱 *<input name="name" required maxlength="80" value="${esc(p.name||'')}"></label><label class="field">植物種類 *<input name="species" required maxlength="100" value="${esc(p.species||'')}"></label><label class="field">澆水週期（天） *<input name="interval" type="number" min="1" max="3650" required value="${p.wateringInterval||7}"></label><label class="field">上次澆水日期 *<input name="last" type="date" required value="${p.lastWatered||today()}"></label><label class="field">下次澆水日期（可手動調整）<input name="next" type="date" value="${p.nextWatering||''}"></label><label class="field">擺放位置<input name="location" maxlength="100" value="${esc(p.location||'')}"></label><label class="field">日照環境<select name="sunlight">${['','直射日照','明亮散射光','半陰','低光照'].map(v=>`<option ${p.sunlight===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">植物照片<input name="photo" type="file" accept="image/*"><span class="filehint">建議上傳清晰照片，系統會壓縮以節省儲存空間。</span></label><div class="full">${p.photo?`<img src="${esc(p.photo)}" alt="目前照片" style="height:100px;border-radius:12px"> <label class="small"><input type="checkbox" name="removePhoto"> 移除照片</label>`:''}</div><div class="full"><button class="btn" type="submit">儲存植物檔案</button></div></form>`;show('editor')}
const questions=[['葉片顏色','葉片是否維持該植物應有的正常顏色？',15],['葉片硬度','葉片是否維持正常的挺立或彈性？',15],['葉片捲曲','葉片是否沒有異常捲曲或變形？',10],['葉片損傷','葉片是否沒有異常斑點、焦邊或壞死？',10],['土壤濕度','土壤濕度是否符合此植物的需求？',10],['日照環境','光照條件是否適合此植物？',10],['病蟲害','是否沒有觀察到病蟲害跡象？',15],['異常落葉','是否沒有異常落葉？',5],['莖部狀態','莖部與整體植株是否正常？',5],['生長狀況','近期生長狀況是否符合植物生長週期？',5]];
function assessment(id){selectedId=id;$('#assessment').innerHTML=`<button class="back" data-page="detail">← 返回植物詳情</button><h1>健康評估</h1><p class="muted">請依植物本身的正常狀況回答，評分僅供追蹤參考。</p><form id="healthForm" class="card pad"><label class="field">評估日期<input name="date" type="date" max="${today()}" value="${today()}" required></label>${questions.map((q,i)=>`<div class="question"><strong>${i+1}. ${q[0]}</strong><div class="small muted">${q[1]}（滿分 ${q[2]}）</div><select name="q${i}" required><option value="">請選擇</option><option value="1">正常</option><option value="0.5">輕微異常</option><option value="0">明顯異常</option></select></div>`).join('')}<button class="btn" type="submit" style="margin-top:20px">完成評估並儲存</button></form>`;show('assessment')}
function level(n){return n>=80?'健康狀況良好':n>=60?'需要留意':n>=40?'建議加強照護':'需要進一步檢查'}
function nextAfterWater(p,date){let n=p.wateringInterval,base=nextDate(p);if(date<base)return base;let passed=Math.floor(diff(date,base)/n)+1;return addDays(base,passed*n)}
async function water(id,date=today(),note=''){let p=plants.find(x=>x.id===id);if(!p)return;await put('care',{id:uid(),plantId:id,type:'water',date,note,createdAt:new Date().toISOString()});if(date>=p.lastWatered){let next=nextAfterWater(p,date);p.lastWatered=date;p.nextWatering=next;await put('plants',p)}await reload();toast('澆水紀錄已儲存')}
async function saveCare(id){let p=plants.find(x=>x.id===id);if(!p)return;let type=prompt('輸入照護類型：1 為澆水，2 為施肥','2');if(type===null)return;if(!['1','2'].includes(type)){toast('請輸入 1 或 2');return}let date=prompt('照護日期（YYYY-MM-DD）',today());if(date===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!validDate(date)||date>today()){toast('日期格式錯誤或為未來日期');return}let note=prompt('備註（可留空）','');if(note===null)return;if(type==='1')return water(id,date,note);await put('care',{id:uid(),plantId:id,type:'fertilize',date,note,createdAt:new Date().toISOString()});await reload();toast('施肥紀錄已儲存')}
function validDate(s){return localDate(parseDate(s))===s}function imageData(file){return new Promise((res,rej)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let ratio=Math.min(1,1100/img.width,1100/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);res(canvas.toDataURL('image/jpeg',.76))};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('圖片無法讀取'))};img.src=url})}
async function exportBackup(){let payload={app:'Planter',schemaVersion:1,exportedAt:new Date().toISOString(),plants,care,health};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`planter-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function importBackup(file){if(file.size>30*1024*1024)throw Error('備份檔超過 30 MB');let obj=JSON.parse(await file.text());if(obj.app!=='Planter'||obj.schemaVersion!==1||!['plants','care','health'].every(k=>Array.isArray(obj[k])))throw Error('備份格式或版本不正確');for(let p of obj.plants)if(typeof p.id!=='string'||typeof p.name!=='string'||typeof p.species!=='string'||!Number.isInteger(p.wateringInterval)||p.wateringInterval<1||!validDate(p.lastWatered)||!validDate(p.nextWatering))throw Error('植物資料有誤');let ids=new Set(obj.plants.map(p=>p.id));if(ids.size!==obj.plants.length)throw Error('植物 ID 重複');for(let k of ['care','health']){let seen=new Set;for(let x of obj[k]){if(typeof x.id!=='string'||seen.has(x.id)||!ids.has(x.plantId)||!validDate(x.date))throw Error('紀錄資料有誤');seen.add(x.id)}}for(let x of obj.health)if(!Number.isFinite(x.score)||x.score<0||x.score>100||!Array.isArray(x.answers))throw Error('健康資料有誤');if(!confirm(`匯入 ${obj.plants.length} 株植物，將完整取代目前資料，確定嗎？`))return;await new Promise((res,rej)=>{let tx=db.transaction(['plants','care','health'],'readwrite');tx.oncomplete=res;tx.onerror=()=>rej(tx.error);for(let k of ['plants','care','health']){let store=tx.objectStore(k);store.clear();obj[k].forEach(v=>store.put(v))}});selectedId=null;await reload();show('home');toast('備份匯入成功')}
async function deleteCare(id){let c=care.find(x=>x.id===id);if(!c||!confirm('確定刪除此照護紀錄？'))return;await del('care',id);if(c.type==='water'){let p=plants.find(x=>x.id===c.plantId);if(p){let remaining=care.filter(x=>x.plantId===p.id&&x.type==='water'&&x.id!==id).sort((a,b)=>b.date.localeCompare(a.date));if(remaining.length){p.lastWatered=remaining[0].date;p.nextWatering=addDays(p.lastWatered,p.wateringInterval)}else{p.nextWatering=addDays(p.lastWatered,p.wateringInterval)}await put('plants',p)}}await reload();toast('紀錄已刪除')}
async function deletePlant(id){let p=plants.find(x=>x.id===id);if(!p||!confirm(`確定刪除「${p.name}」及其所有紀錄？此操作無法復原。`))return;await new Promise((res,rej)=>{let tx=db.transaction(['plants','care','health'],'readwrite');tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.objectStore('plants').delete(id);for(let c of care.filter(x=>x.plantId===id))tx.objectStore('care').delete(c.id);for(let h of health.filter(x=>x.plantId===id))tx.objectStore('health').delete(h.id)});selectedId=null;await reload();show('plants');toast('植物已刪除')}
function onClick(e){let b=e.target.closest('[data-page],[data-add],[data-detail],[data-water],[data-care],[data-edit],[data-assess],[data-delete-care],[data-delete-health],[data-delete-plant],[data-month],[data-day]');if(!b)return;let d=b.dataset;if(d.page){show(d.page);return}if('add'in d){editor();return}if(d.detail){selectedId=d.detail;show('detail');return}if(d.water){water(d.water);return}if(d.care){saveCare(d.care);return}if(d.edit){editor(d.edit);return}if(d.assess){assessment(d.assess);return}if(d.deleteCare){deleteCare(d.deleteCare);return}if(d.deleteHealth){if(confirm('確定刪除這次健康評估？'))del('health',d.deleteHealth).then(reload);return}if(d.deletePlant){deletePlant(d.deletePlant);return}if(d.month){month+=Number(d.month);if(month>11){month=0;year++}if(month<0){month=11;year--}pickedDate=localDate(new Date(year,month,1));renderCalendar();return}if(d.day){pickedDate=d.day;renderCalendar()}}
async function onSubmit(e){if(e.target.id==='plantForm'){e.preventDefault();let f=new FormData(e.target),interval=Number(f.get('interval')),last=f.get('last'),next=f.get('next')||addDays(last,interval);if(!Number.isInteger(interval)||interval<1||interval>3650||!validDate(last)||!validDate(next)){toast('請確認澆水週期及日期');return}let old=plants.find(p=>p.id===editId),file=e.target.querySelector('[name=photo]').files[0],photo=old?.photo||null;try{if(f.get('removePhoto'))photo=null;if(file)photo=await imageData(file);let p={id:old?.id||uid(),name:String(f.get('name')).trim(),species:String(f.get('species')).trim(),wateringInterval:interval,lastWatered:last,nextWatering:next,location:String(f.get('location')).trim(),sunlight:String(f.get('sunlight')),photo};if(!p.name||!p.species){toast('請填寫植物名稱與種類');return}await put('plants',p);selectedId=p.id;await reload();show('detail');toast('植物檔案已儲存')}catch(err){toast('儲存失敗：'+err.message)}return}if(e.target.id==='healthForm'){e.preventDefault();let f=new FormData(e.target),answers=questions.map((q,i)=>Number(f.get('q'+i))),score=Math.round(answers.reduce((a,v,i)=>a+v*questions[i][2],0));await put('health',{id:uid(),plantId:selectedId,date:f.get('date'),answers,score,level:level(score),createdAt:new Date().toISOString()});await reload();show('detail');let bad=answers.map((v,i)=>v<1?questions[i][0]:null).filter(Boolean);toast(`健康評分 ${score} 分${bad.length?'，建議留意：'+bad.slice(0,2).join('、'):''}`)}}
document.addEventListener('click',e=>{if(e.target.id==='topAdd')return editor();if(e.target.id==='export')return exportBackup();onClick(e)});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-detail][role=button]')){e.preventDefault();selectedId=e.target.dataset.detail;show('detail')}});document.addEventListener('submit',onSubmit);document.addEventListener('change',async e=>{if(e.target.id==='import'&&e.target.files[0]){try{await importBackup(e.target.files[0])}catch(err){toast('匯入失敗：'+err.message)}e.target.value=''}});
(async()=>{try{db=await openDB();await reload()}catch(e){$('#home').innerHTML='<div class="empty">無法使用瀏覽器本機資料庫。請使用一般瀏覽模式，並確認瀏覽器允許網站儲存資料。</div>';console.error(e)}})();
</script></body></html>
